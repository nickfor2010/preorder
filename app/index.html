<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarketRecipe</title>
<meta name="apple-mobile-web-app-title" content="MarketRecipe">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffaf3">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#2b2118;--mu:#7a6a5c;--ac:#d9622b;--ok:#2e8b57;--bd:#eadfce;--warn:#e0a020;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#2a231d;--tx:#f5ece2;--mu:#b5a493;--ac:#f08a52;--ok:#5cc98a;--bd:#3d342b;--bad:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#2a231d;--tx:#f5ece2;--mu:#b5a493;--ac:#f08a52;--ok:#5cc98a;--bd:#3d342b;--bad:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:10px 16px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:15px;margin:18px 2px 6px;color:var(--mu)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--bd)}
.top h1{font-size:20px;margin:0;flex:1}
.back{font-size:34px;line-height:1;padding:0 12px 4px 0;color:var(--ac)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;padding:8px 4px 10px;font-size:13px;color:var(--mu)}
.tabs a span{display:block;font-size:22px}.tabs a.on{color:var(--ac);font-weight:700}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;width:100%;text-align:left}
.card.off{opacity:.55}
.row{display:flex;align-items:center;gap:10px}.gap{gap:8px}.grow{flex:1;min-width:0}
.col-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mu{color:var(--mu);font-size:14px}.small{font-size:13px}.c{text-align:center}
button,.btn,input,select,textarea{font:inherit;color:inherit}
button,.btn{display:inline-block;border:0;border-radius:12px;padding:12px 14px;background:var(--bd);cursor:pointer;min-height:48px;text-align:center}
button:disabled{opacity:.35}
.pri{background:var(--ac);color:#fff;font-weight:700;width:100%;padding:15px;font-size:18px;margin-top:10px}
.ghost{background:none;border:1px solid var(--bd);color:var(--mu)}
.wide{display:block;width:100%;margin-top:10px}
.danger{color:var(--bad);border-color:var(--bad)}
.sm{min-height:40px;min-width:40px;padding:8px 10px;font-size:14px}
.sticky{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.busy{opacity:.6;pointer-events:none}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);min-height:48px;font-size:17px}
input[type=checkbox],input[type=radio]{width:26px;height:26px;min-height:0;accent-color:var(--ac);flex:none}
input[readonly]{opacity:.7}
.lbl{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}.lbl input{margin-top:4px;color:var(--tx)}
.form .lbl:first-child{margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;position:relative}.chip input{position:absolute;opacity:0}
.chip span{display:block;text-align:center;padding:10px 6px;border:2px solid var(--bd);border-radius:12px}
.chip input:checked+span{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.chip .tag{background:none;padding:0;color:inherit}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;background:var(--bd);white-space:nowrap}
.st-open{background:var(--ok);color:#fff}.st-closed{opacity:.7}
.hero{text-align:center;margin:24px 0 8px}.hero img{width:96px;height:96px;border-radius:22px}
.code{font-size:30px;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums}
.prod .nums{margin-top:8px}.prod .nums label{flex:1;font-size:13px;color:var(--mu)}
.prod .nums input{margin-top:2px;color:var(--tx);text-align:center}
.prod.off .nums{display:none}
.pick{display:flex;align-items:center;gap:10px;font-size:16px}.pick.sel{border:2px solid var(--ac)}
.market-head{display:flex;gap:10px;border-color:var(--ac)}
.link{color:var(--ac);font-size:14px}
.menu span:first-child{font-size:22px}
.soon{border-style:dashed}
details{margin-top:16px}summary{color:var(--mu);padding:10px 2px;cursor:pointer}
.sel-all{user-select:all;word-break:break-all}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;margin:auto;max-width:520px;
  background:#2b2118;color:#fff;padding:14px;border-radius:12px;text-align:center;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}#toast.err{background:var(--bad)}
body.offline .top::after{content:"Offline 離線";font-size:12px;background:var(--warn);color:#000;padding:3px 8px;border-radius:99px}
.hide{display:none!important}.mt{margin-top:8px}.block{display:block}
.ok{background:var(--ok);color:#fff;font-weight:700}
.pri.alt{background:var(--card);color:var(--ac);border:2px solid var(--ac)}
.tabs a{position:relative}.dot{position:absolute;top:4px;left:55%;background:var(--warn);color:#000;font-style:normal;font-size:11px;border-radius:99px;padding:1px 6px}
.chipb{flex:1;min-width:72px;padding:10px 6px;border:2px solid var(--bd);background:var(--card);font-size:15px;line-height:1.25}
.chipb.on{border-color:var(--ac);background:var(--ac);color:#fff;font-weight:700}
.tag.warn{background:var(--warn);color:#000}.tag.bad{background:var(--bad);color:#fff}
.tag.paid{background:color-mix(in srgb,var(--ok) 18%,transparent)}.tag.unpaid{background:none;border:1px solid var(--bd)}
.tag.st-ready{background:var(--ok);color:#fff}.tag.st-picked_up{opacity:.7}
.bad-tx{color:var(--bad)}
.item .tag{margin-top:4px}.item.picked{border:2px solid var(--ac)}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:52px;height:52px;font-size:26px;padding:0;border-radius:14px}
.qty .n{min-width:30px;text-align:center;font-size:22px}
.total{font-size:18px}.pkline{margin:6px 2px}
#pkn,#pks{margin-top:8px}
.big-check{font-size:18px;margin-top:12px}
.syncbar{border-color:var(--warn);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.syncbar.err{border-color:var(--bad)}
.make summary{color:var(--tx);padding:0}.make .mk{margin-top:8px}.make .tag{margin:3px 2px 0 0;font-size:15px}
.ord .row{flex-wrap:wrap;row-gap:4px}.ord .code{font-size:22px;letter-spacing:1px}.ord .row .tag{margin-left:4px}.ord.picked_up{opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid2 .pri{margin:0;font-size:16px}
.big-items{font-size:20px;line-height:1.6;margin:10px 0}
.qrpage{padding-top:6px}.qrbox{background:#fff;padding:10px;border-radius:16px;margin:10px auto;width:min(82vw,340px)}
.qrbox svg{width:100%;height:auto;display:block}
.big{font-size:44px;font-weight:800;letter-spacing:2px;color:var(--ac)}
.scanbox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;margin:0 auto}
.scanbox video{width:100%;height:100%;object-fit:cover}
.aim{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:8px}
.note{padding:8px 12px;border-radius:12px;font-size:14px;margin:8px 0}.note.warn{background:var(--warn);color:#000}.note.okc{color:var(--ok)}
.chipb{font-size:14px}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet .pri{margin:0}
</style>
</head>
<body>
<div id="app"><p style="text-align:center;margin-top:40vh;color:#7a6a5c">MarketRecipe…</p></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
