<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Receipt · MarketRecipe</title>
<link rel="icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Customer receipt: one centred column, cream paper, espresso ink, terracotta order number. */
:root{--bg:#F6F0E6;--surface:#FFFCF7;--surface-2:#EFE6D8;--line:#E4D8C7;--ink:#2B1E17;--ink-2:#6F5F52;--accent:#A8472A;--ok:#3E7A55;--ok-soft:#DDEBE0;--line-green:#06C755;
  --serif:"Fraunces","Songti TC","Noto Serif TC",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110E;--surface:#1F1915;--surface-2:#2A221D;--line:#362C25;--ink:#F2E8DC;--ink-2:#B3A291;--accent:#E3875F;--ok:#86C59C;--ok-soft:#1E3326;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110E;--surface:#1F1915;--surface-2:#2A221D;--line:#362C25;--ink:#F2E8DC;--ink-2:#B3A291;--accent:#E3875F;--ok:#86C59C;--ok-soft:#1E3326;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:10px}
h1{font:600 24px/1.2 var(--serif);margin:0;flex:1;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 1px 0 rgba(43,30,23,.04),0 8px 24px -14px rgba(43,30,23,.28)}
.mu{color:var(--ink-2);font-size:14.5px}.c{text-align:center}
.code{font:600 52px/1 var(--serif);letter-spacing:.08em;color:var(--accent);margin:6px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:18px}
.row+.row{border-top:1px solid var(--line)}
.row span{font-family:var(--serif)}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:19px;padding:15px;border-radius:16px;background:var(--surface-2)}
.status.ready{background:var(--ok);color:var(--surface)}.status.picked_up{background:var(--ok-soft);color:var(--ok)}
.lbl{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
:lang(zh-Hant-TW) .lbl{letter-spacing:.12em;text-transform:none;font-size:13.5px}
.big{font:600 21px/1.3 var(--serif)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;font-weight:700;font-size:17px;padding:16px;border-radius:16px;background:var(--line-green);color:#fff}
.btn.alt{background:transparent;color:var(--line-green);border:1.5px solid var(--line-green)}
.lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px}
.foot{text-align:center;color:var(--ink-2);font-size:12.5px;margin-top:6px}
.top{display:flex;justify-content:flex-end}
.receipt{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:22px 20px 16px;position:relative;
  box-shadow:0 8px 24px -14px rgba(43,30,23,.28)}
.receipt::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-10px;height:10px;
  background:radial-gradient(circle at 7px 0,var(--surface) 6.5px,transparent 7px) 0 0/14px 10px repeat-x}
.shop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.shop img{width:76px;height:76px;object-fit:contain;border-radius:16px;background:#fff;border:1px solid var(--line);padding:4px;margin-bottom:6px}
.shop h1{font:600 24px/1.2 var(--serif);margin:0}
.shop .tel{color:var(--accent);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.sec{padding:14px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0;padding-bottom:4px}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.meta .code{font-size:40px;margin:2px 0 0}
.line{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:baseline;padding:5px 0;font-size:17px}
.line .q{color:var(--ink-2);font-variant-numeric:tabular-nums}
.line .p{font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
.line .n{font-family:var(--serif)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.sum b{font:600 26px/1 var(--serif);font-variant-numeric:tabular-nums}
.paid{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;margin-top:10px}
.paid.yes{background:var(--ok-soft);color:var(--ok)}.paid.no{background:var(--surface-2);color:var(--ink-2)}
.btn.call{background:var(--ink);color:var(--surface)}
.thanks{text-align:center;font:500 16px/1.4 var(--serif);color:var(--ink-2);margin-top:14px}
</style>
</head>
<body>
<main id="app"><p class="c mu" style="margin-top:40vh">…</p></main>
<script type="module">
import { SUPABASE_URL, SUPABASE_KEY } from './js/config.js';

const token = (location.hash.match(/t=([A-Za-z0-9]{20,})/) || [])[1];
let lang = (navigator.languages || [navigator.language]).some(l => /^zh/i.test(l)) ? 'zh' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch { }
const T = (en, zh) => lang === 'zh' ? zh : en;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = document.getElementById('app');
let data = null, timer;

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00');
  return lang === 'zh' ? `${d.getMonth() + 1}月${d.getDate()}日（${'日一二三四五六'[d.getDay()]}）`
    : d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
const item = i => lang === 'zh' ? (i.zh || i.en) : (i.en || i.zh);

async function load() {
  if (!token) return draw();
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_order_by_token`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token }),
    });
    if (r.ok) data = (await r.json()) || false;
  } catch { /* offline: keep showing what we have */ }
  draw();
  clearTimeout(timer);
  if (data?.status !== 'picked_up') timer = setTimeout(load, data ? 20000 : 10000);
}

const money = n => 'NT$' + Number(n || 0).toLocaleString('en-US');
const PAY = () => ({ cash: T('Cash', '現金'), linepay: 'LINE Pay', transfer: T('Bank transfer', '轉帳') });
const when = t => t ? new Date(t).toLocaleString(lang === 'zh' ? 'zh-TW' : 'en-GB', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';

function draw() {
  const toggle = `<div class="top"><button class="lang" id="lg">${lang === 'zh' ? 'English' : '中文'}</button></div>`;
  if (!token || data === false) {
    app.innerHTML = toggle + `<div class="card"><h1>${T('Your order', '您的訂單')}</h1><p class="mu">${data === false
      ? T('Your order is being confirmed. This page will update by itself in a moment.', '訂單確認中，此頁面稍後會自動更新。')
      : T('This link is not complete. Please ask the shop.', '連結不完整，請洽店家。')}</p></div>`;
  } else if (!data) {
    app.innerHTML = toggle + `<p class="c mu" style="margin-top:30vh">${T('Loading…', '載入中…')}</p>`;
  } else {
    const o = data, s = o.shop || {}, m = o.market;
    const hasPrice = o.items.some(i => i.price != null);
    const st = { waiting: T('Being prepared', '準備中'), ready: T('Ready for pickup', '可以取貨了'), picked_up: T('Picked up · thank you!', '已取貨，謝謝！') }[o.status];
    const where = o.pickup_kind === 'market' && m
      ? `<div class="big">${esc(m.name)}</div><div>${esc(fmtDate(m.date))}${o.pickup_time ? ' · ' + esc(o.pickup_time) : ''}</div>${m.location ? `<div class="mu">${esc(m.location)}</div>` : ''}`
      : `<div class="big">${T('At the shop', '到店取貨')}</div><div>${esc(fmtDate(o.pickup_date))}${o.pickup_time ? ' · ' + esc(o.pickup_time) : ''}</div>${s.address ? `<div class="mu">${esc(s.address)}</div>` : ''}${s.hours ? `<div class="mu">${esc(s.hours)}</div>` : ''}`;
    const tel = (s.phone || '').replace(/[^\d+]/g, '');
    const msg = [s.name, `${T('Order', '訂單')} #${o.code}`, ...o.items.map(i => `${item(i)} × ${i.qty}`),
      hasPrice ? `${T('Total', '合計')}: ${money(o.total)}` : '',
      `${T('Pickup', '取貨')}: ${o.pickup_kind === 'market' && m ? m.name + ' ' + fmtDate(m.date) : T('At the shop', '到店') + ' ' + fmtDate(o.pickup_date)} ${o.pickup_time || ''}`,
      s.phone ? `${T('Shop phone', '店家電話')}: ${s.phone}` : '', location.href].filter(Boolean).join('\n');
    app.innerHTML = toggle + `
      <div class="status ${o.status}">${st}</div>
      <div class="receipt">
        <div class="shop">
          ${s.logo ? `<img src="${esc(s.logo)}" alt="${esc(s.name)}">` : ''}
          <h1>${esc(s.name || '')}</h1>
          ${s.phone ? `<a class="tel" href="tel:${esc(tel)}">${T('Tel', '電話')} ${esc(s.phone)}</a>` : ''}
          ${s.address ? `<div class="mu">${esc(s.address)}</div>` : ''}
        </div>
        <div class="sec meta">
          <div><div class="lbl">${T('Order number', '訂單編號')}</div><div class="code">#${esc(o.code)}</div></div>
          <div class="mu" style="text-align:right;font-size:13.5px">${T('Ordered', '下單時間')}<br>${esc(when(o.created_at))}</div>
        </div>
        <div class="sec">
          ${o.items.map(i => `<div class="line"><span class="n">${esc(item(i))}</span><span class="q">× ${i.qty}</span>${hasPrice ? `<span class="p">${money(i.qty * i.price)}</span>` : '<span></span>'}</div>`).join('')}
          ${hasPrice ? `<div class="sum"><span>${T('Total', '合計')}</span><b>${money(o.total)}</b></div>` : ''}
          <div class="paid ${o.paid ? 'yes' : 'no'}">${o.paid ? T('Paid', '已付款') + (o.payment_type ? ' · ' + PAY()[o.payment_type] : '') : T('Pay at pickup', '取貨時付款')}</div>
          ${o.note ? `<div class="mu" style="margin-top:8px">${T('Note', '備註')}：${esc(o.note)}</div>` : ''}
        </div>
        <div class="sec"><div class="lbl">${T('Pickup', '取貨')}</div>${where}</div>
        <div class="sec mu c" style="font-size:13.5px">${T('Show this page or your photo at pickup.', '取貨時請出示此頁面或照片。')}</div>
      </div>
      <div style="height:6px"></div>
      <a class="btn" href="https://line.me/R/share?text=${encodeURIComponent(msg)}">${T('Save to my LINE', '傳到我的 LINE')}</a>
      ${s.phone ? `<a class="btn call" href="tel:${esc(tel)}">${T('Call the shop', '打電話給店家')} · ${esc(s.phone)}</a>` : ''}
      ${s.line ? `<a class="btn alt" href="https://line.me/R/ti/p/${encodeURIComponent(s.line)}">${T('Add the shop on LINE', '加入店家 LINE')}</a>` : ''}
      <p class="thanks">${T('Thank you!', '謝謝您的訂購！')}</p>
      <p class="foot">${T('This page updates by itself.', '此頁面會自動更新。')}</p>`;
  }
  document.getElementById('lg').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('lang', lang); } catch { } draw(); };
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en';
  document.title = data ? `#${data.code} · ${data.shop?.name || ''}` : T('Order', '訂單');
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && data?.status !== 'picked_up') load(); });
draw(); load();
</script>
</body>
</html>
